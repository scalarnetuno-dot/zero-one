# ─────────────────────────────────────────────────────────────────────────────
# IDENTIDADE DA COLEÇÃO
# Vale para TODOS os volumes. Um livro só sobrescreve metadata + cor.
# ─────────────────────────────────────────────────────────────────────────────
collection:
  name: "Zero One"
  tagline: "Programação, do zero ao primeiro programa que serve para algo."
  publisher: "Knowpill"
  author_default: "Thiago Pablicio"
  language_default: "pt-BR"
  site: "knowpill.com"

# Rótulos de texto do sistema (por idioma).
# Traduzir um volume = escolher o idioma aqui + traduzir o conteúdo.
