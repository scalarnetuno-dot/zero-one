    summary: "Resumo"
    answers: "Respostas"
    glossary: "Glossário"
    toc: "Sumário"
    colophon: "Colofão"
    tip: "Dica"
    warning: "Atenção"
    note: "Nota"
    key: "O essencial"
    practice: "Na prática"
    continues: "continua"
    of: "de"
  en:
    chapter: "Chapter"
    part: "Part"
    figure: "Figure"
    table: "Table"
    listing: "Listing"
    exercise: "Exercise"
    example: "Example"
    summary: "Summary"
