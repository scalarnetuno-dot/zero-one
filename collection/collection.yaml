  red:    "#B32B23"
  blue:   "#1F5FA8"
  green:  "#1F7A4D"
  orange: "#C2611A"
  purple: "#5C3D8F"
  teal:   "#116B72"
  amber:  "#9A6B00"
  slate:  "#3C4A57"
