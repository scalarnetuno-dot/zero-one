# ─── PARTES ─────────────────────────────────────────────────────────────
parts:
- id: p1
  title: A web por baixo do framework
  blurb: HTTP, REST e um framework de quarenta linhas escrito à mão. Depois deste
    trecho, nenhuma parte do Laravel vai parecer mágica — vai parecer trabalho
    que alguém já fez.
  number: 1
- id: p2
  title: Dentro do Laravel
  blurb: Estrutura, configuração, rotas, controllers e respostas. O framework
    chegando depois do problema, que é a única ordem em que ele faz sentido.
  number: 2
- id: p3
  title: Eloquent sobre o SQL que você já sabe
  blurb: O ORM entra depois do SQL. Cada método tem uma consulta correspondente
    que você consegue escrever à mão — e é isso que separa usar o Eloquent de
    depender dele.
  number: 3
- id: p4
  title: A API de verdade
  blurb: 'O que separa um CRUD de exercício de uma API que outra pessoa consome:
    validação, formato de saída, paginação, filtros e erro honesto.'
  number: 4
- id: p5
  title: Arquitetura e segurança
  blurb: 'Onde a regra de negócio mora, quantas camadas o seu projeto realmente
    precisa, e as duas perguntas que toda requisição responde: quem é você e o
    que você pode.'
  number: 5
- id: p6
  title: Depois da resposta
  blurb: Eventos, filas, cache e log. O trabalho que não cabe dentro da requisição
    — e o que você vai querer ter medido quando algo quebrar.
  number: 6
- id: p7
  title: Provar e publicar
  blurb: Testes que dizem o que estão tentando provar, documentação que nasce
    do código, e o caminho até o dia do deploy sem plantão de madrugada.
  number: 7
- id: p8
  title: O sistema no ar
  blurb: 'O dia seguinte ao deploy. Os pedidos que só aparecem quando gente de
    verdade usa o sistema: foto de celular, e-mail que sai assinado por quem
    não devia e fila que cresce mais rápido do que esvazia.'
  number: 8

