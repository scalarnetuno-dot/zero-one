# ─── VOLUME 2 ────────────────────────────────────────────────────────────────
title: "Python One"
subtitle: "Do primeiro print à API REST em produção"
author: "Thiago Nogueira"
volume: 2
accent: blue
language: pt-BR
year: 2026
edition: "1ª edição"
isbn: ""

description: >-
  Python do zero até uma API REST completa: FastAPI, PostgreSQL, SQLAlchemy,
  validação, JWT, testes e Docker. Um único projeto cresce capítulo a
  capítulo — nada de exemplos soltos, nada de teoria antes da hora.

keywords: [Python, FastAPI, API REST, SQLAlchemy, PostgreSQL, JWT, CRUD, backend, Pydantic]

cover_image: capa.png
cover_full: true

cover_bullets:
  - "Um projeto só, crescendo do capítulo 1 ao 42"
  - "Cada conceito aparece quando o projeto precisa dele"
  - "Erros de verdade, lidos linha por linha"
  - "API com validação, segurança, testes e Docker"
  - "Sem promessa de 'aprenda em 24 horas' e sem atalho que cobra depois"

course_slug: python-one

# ─── PARTES ──────────────────────────────────────────────────────────────────
parts:
  - id: p1
    title: "Começando do zero"
    blurb: >-
      Você escreve Python antes de entender Python. A linguagem entra pela
      porta da prática: rodar, errar, ler o erro, consertar.
  - id: p2
    title: "O Python que você realmente precisa"
    blurb: >-
      Não a linguagem toda — a parte dela que sustenta uma API. Módulos,
      objetos, exceções e tipagem moderna, na dose exata.
  - id: p3
    title: "Entrando no FastAPI"
    blurb: >-
      O framework que lê tipos Python e devolve documentação, validação e
      rotas prontas. E o preço disso: entender o que ele decide por você.
  - id: p4
    title: "Construindo o CRUD"
    blurb: >-
      A espinha dorsal do livro. Schema, banco, repositório, serviço e rota
      — nesta ordem, uma camada por vez.
  - id: p5
    title: "API de verdade"
    blurb: >-
      O que separa um CRUD de exercício de uma API que outra pessoa usa:
      validação, erro honesto, paginação e busca.
  - id: p6
    title: "O Python que ninguém vê no tutorial"
    blurb: >-
      Relacionamentos, migrações, injeção de dependência e async — onde o
      framework fica poderoso e perigoso na mesma medida.
  - id: p7
    title: "Segurança"
    blurb: >-
      Autenticação, autorização e um token que diz quem você é sem que o
      servidor precise lembrar.
  - id: p8
    title: "Testes"
    blurb: >-
      A rede que permite mexer no código sem medo. Unidade, integração e
      um banco de verdade dentro do teste.
  - id: p9
    title: "Documentação e ferramentas"
    blurb: >-
      Uma API que ninguém sabe usar não existe. E um projeto sem histórico
      não tem volta.
  - id: p10
    title: "Projeto final"
    blurb: >-
      Agora sem mastigar. Você recebe os requisitos e constrói a loja
      inteira — e depois a coloca no ar.

