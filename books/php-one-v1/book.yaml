# ─── PARTES ─────────────────────────────────────────────────────────────
parts:
- id: p1
  title: PHP do zero
  blurb: A linguagem antes de qualquer framework. Rodar, errar, ler a mensagem,
    consertar — e descobrir cedo os dois ou três lugares em que o PHP resolve
    sozinho o que você não pediu.
  number: 1
- id: p2
  title: O dado precisa morar em algum lugar
  blurb: Banco de dados no meio da linguagem, não no fim do livro. Arquivo, concorrência,
    SQL escrito à mão, JOIN, índice e PDO — para que o Eloquent, no volume 2,
    tenha algo a que ser comparado.
  number: 2
- id: p3
  title: Do script ao projeto
  blurb: O momento em que um arquivo vira trinta. Composer, autoload, namespaces
    e as primeiras classes — a fronteira entre escrever PHP e manter um projeto
    PHP.
  number: 3
- id: p4
  title: O PHP que o Laravel exige
  blurb: 'Interfaces, exceções, tipagem estrita e enums. Nenhum recurso aparece
    por ser novo: cada um está aqui porque o framework vai pedir por ele no volume
    2.'
  number: 4
- id: p5
  title: Antes da web
  blurb: 'O que falta entre a linguagem e o framework: referências, closures,
    arquivos grandes, datas com fuso, erros que avisam e um projeto com lugar
    para cada coisa. A última parte do volume 1 é a primeira porta do volume
    2.'
  number: 5

