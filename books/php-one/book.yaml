# ─── VOLUME 3 ────────────────────────────────────────────────────────────────
title: "PHP One"
subtitle: "Do zero à API com Laravel"
author: "Thiago Nogueira"
volume: 3
accent: purple
language: pt-BR
year: 2026
edition: "1ª edição"
isbn: ""

description: >-
  PHP moderno do zero até uma API Laravel em produção: Composer, orientação a
  objetos, HTTP, Eloquent, Sanctum, Policies, filas, testes e deploy. Um
  projeto só, crescendo capítulo a capítulo — e a linguagem antes do
  framework, para você entender o que o Laravel está fazendo por baixo.

keywords: [PHP, Laravel, API REST, Eloquent, Composer, Sanctum, Pest, PHPUnit, backend, MySQL]

cover_image: capa.png
cover_full: true

cover_bullets:
  - "PHP moderno: strict types, enums, readonly, match"
  - "O framework entra quando você já entende o problema"
  - "Um framework de quarenta linhas, escrito à mão, antes do Laravel"
  - "API com validação, autorização, filas, testes e documentação"
  - "Sem catálogo de comandos do Artisan e sem 'é só um CRUD'"

course_slug: php-one

# ─── PARTES ──────────────────────────────────────────────────────────────────
parts:
  - id: p1
    title: "PHP do zero"
    blurb: >-
      A linguagem antes de qualquer framework. Rodar, errar, ler a mensagem,
      consertar — e descobrir cedo os dois ou três lugares em que o PHP
      resolve sozinho o que você não pediu.
  - id: p2
    title: "O dado precisa morar em algum lugar"
    blurb: >-
      Banco de dados no meio da linguagem, não no fim do livro. Arquivo,
      concorrência, SQL escrito à mão, JOIN, índice e PDO — para que o
      Eloquent, duzentas páginas adiante, tenha algo a que ser comparado.
  - id: p3
    title: "Do script ao projeto"
    blurb: >-
      O momento em que um arquivo vira trinta. Composer, autoload, namespaces
      e as primeiras classes — a fronteira entre escrever PHP e manter um
      projeto PHP.
  - id: p4
    title: "O PHP que o Laravel exige"
    blurb: >-
      Interfaces, exceções, tipagem estrita e enums. Nenhum recurso aparece
      por ser novo: cada um está aqui porque o framework vai pedir por ele
      duzentas páginas adiante.
  - id: p5
    title: "A web por baixo do framework"
    blurb: >-
      HTTP, REST e um framework de quarenta linhas escrito à mão. Depois
      deste trecho, nenhuma parte do Laravel vai parecer mágica — vai parecer
      trabalho que alguém já fez.
  - id: p6
    title: "Dentro do Laravel"
    blurb: >-
      Estrutura, configuração, rotas, controllers e respostas. O framework
      chegando depois do problema, que é a única ordem em que ele faz
      sentido.
  - id: p7
    title: "Eloquent sobre o SQL que você já sabe"
    blurb: >-
      O ORM entra depois do SQL. Cada método tem uma consulta correspondente
      que você consegue escrever à mão — e é isso que separa usar o Eloquent
      de depender dele.
  - id: p8
    title: "A API de verdade"
    blurb: >-
      O que separa um CRUD de exercício de uma API que outra pessoa consome:
      validação, formato de saída, paginação, filtros e erro honesto.
  - id: p9
    title: "Arquitetura e segurança"
    blurb: >-
      Onde a regra de negócio mora, quantas camadas o seu projeto realmente
      precisa, e as duas perguntas que toda requisição responde: quem é você
      e o que você pode.
  - id: p10
    title: "Depois da resposta"
    blurb: >-
      Eventos, filas, cache e log. O trabalho que não cabe dentro da
      requisição — e o que você vai querer ter medido quando algo quebrar.
  - id: p11
    title: "Provar e publicar"
    blurb: >-
      Testes que dizem o que estão tentando provar, documentação que nasce do
      código, e o caminho até o dia do deploy sem plantão de madrugada.

