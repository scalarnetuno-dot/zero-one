course_slug: java-one

# ─── PARTES ──────────────────────────────────────────────────────────────────
parts:
  - id: p1
    title: "Começando do zero"
    blurb: >-
      Você escreve Java antes de entender Java. A linguagem entra pela porta
      da prática: compilar, errar, ler o erro, consertar.
  - id: p2
    title: "O Java que você realmente precisa"
    blurb: >-
      Não a linguagem toda — a parte dela que sustenta uma API. Métodos,
      coleções, objetos, exceções e streams, na dose exata.
  - id: p3
    title: "Entrando no Spring Boot"
    blurb: >-
      O framework que escreve o encanamento por você. E o preço disso:
      entender quem está chamando o seu código.
  - id: p4
    title: "Construindo o CRUD"
    blurb: >-
      A espinha dorsal do livro. Entidade, banco, repositório, serviço,
      controlador e DTO — nesta ordem, uma camada por vez.
  - id: p5
    title: "API de verdade"
    blurb: >-
      O que separa um CRUD de exercício de uma API que outra pessoa usa:
      validação, erro honesto, paginação e busca.
  - id: p6
    title: "Relacionamentos"
    blurb: >-
      Quando as tabelas se conhecem, o JPA fica poderoso e perigoso na
      mesma medida. Aqui está o mapa dos buracos.
  - id: p7
    title: "Segurança"
    blurb: >-
      Autenticação, autorização e um token que diz quem você é sem que o
      servidor precise lembrar.
  - id: p8
    title: "Testes"
    blurb: >-
      A rede que permite mexer no código sem medo. Unidade, integração e
      um banco de verdade dentro do teste.
  - id: p9
    title: "Documentação e ferramentas"
    blurb: >-
      Uma API que ninguém sabe usar não existe. E um projeto sem histórico
      não tem volta.
  - id: p10
    title: "Projeto final"
    blurb: >-
      Agora sem mastigar. Você recebe os requisitos e constrói a loja
      inteira — e depois a coloca no ar.

